<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="TicketUnaj: descubre eventos, elige tu butaca y compra tus entradas en una sola plataforma."
    />
    <meta name="theme-color" content="#f5efe3" />
    <title>TicketUnaj</title>
    <style>
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top left, rgba(163, 59, 32, 0.14), transparent 28%),
          radial-gradient(circle at bottom right, rgba(110, 85, 49, 0.18), transparent 30%),
          linear-gradient(160deg, #f8f3ea 0%, #f4efe6 100%);
      }

      .app-loader {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .app-loader-card {
        display: grid;
        justify-items: center;
        gap: 14px;
        width: min(100%, 320px);
        padding: 28px 24px;
        border-radius: 28px;
        border: 1px solid rgba(121, 93, 64, 0.14);
        background:
          radial-gradient(circle at top left, rgba(246, 194, 139, 0.16), transparent 26%),
          linear-gradient(180deg, rgba(255, 250, 242, 0.98), rgba(248, 240, 229, 0.98));
        box-shadow: 0 18px 40px rgba(53, 28, 18, 0.08);
        text-align: center;
      }

      .app-loader-badge {
        display: inline-flex;
        align-items: center;
        min-height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        border: 1px solid rgba(163, 59, 32, 0.14);
        background: rgba(255, 248, 238, 0.96);
        color: #8d3d1f;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .app-loader-title {
        margin: 0;
        color: #2a1a12;
        font-size: clamp(34px, 6vw, 44px);
        line-height: 0.96;
        letter-spacing: -0.05em;
      }

      .app-loader-copy {
        margin: 0;
        color: #6e5a4c;
        font-size: 14px;
        line-height: 1.6;
      }

      .app-loader-spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(163, 59, 32, 0.18);
        border-top-color: #a33b20;
        border-right-color: #d9a441;
        animation: app-loader-spin 0.85s linear infinite;
      }

      @keyframes app-loader-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loader">
        <div class="app-loader-card">
          <span class="app-loader-badge">TicketUnaj</span>
          <div class="app-loader-spinner" aria-hidden="true"></div>
          <h1 class="app-loader-title">Cargando</h1>
          <p class="app-loader-copy">Preparando tu acceso a eventos, sectores y entradas.</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
